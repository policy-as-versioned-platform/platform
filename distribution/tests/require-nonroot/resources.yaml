# pod-N-* claim policy-version N; unversioned claims none.
apiVersion: v1
kind: Pod
metadata: { name: pod-2-compliant, labels: { "policy-as-versioned.dev/policy-version": "2.0.0" } }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata: { name: pod-2-violating, labels: { "policy-as-versioned.dev/policy-version": "2.0.0" } }
spec:
  containers: [{ name: c, image: nginx }]
---
# Compliant under 2.0.0 (runAsNonRoot) but would FAIL 3.0.0 (no read-only fs).
# It claims 2.0.0, so 3.0.0 must SKIP it — that is coexistence, not collision.
apiVersion: v1
kind: Pod
metadata: { name: pod-3-compliant, labels: { "policy-as-versioned.dev/policy-version": "3.0.0" } }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx, securityContext: { readOnlyRootFilesystem: true } }]
---
apiVersion: v1
kind: Pod
metadata: { name: pod-3-violating, labels: { "policy-as-versioned.dev/policy-version": "3.0.0" } }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx }]
---
# No policy-version label -> out of scope of every versioned policy (proves the
# matchConditions self-scoping, not an objectSelector).
apiVersion: v1
kind: Pod
metadata: { name: pod-unversioned }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx }]
