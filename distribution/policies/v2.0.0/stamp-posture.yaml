# Self-scopes via matchConditions on the policy-version label -- NOT
# matchConstraints.objectSelector, which Kyverno flattens into one shared
# ValidatingWebhookConfiguration (last-reconciled-wins) and silently breaks
# multi-version coexistence.
apiVersion: policies.kyverno.io/v1alpha1
kind: MutatingPolicy
metadata:
  name: stamp-posture-2-0-0
  labels:
    app.kubernetes.io/part-of: platform
    policy-as-versioned.dev/policy: posture
    policy-as-versioned.dev/policy-version: 2.0.0
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: claims-a-policy-version
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') != ''
  - name: only-this-policy-version
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') == '2.0.0'
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{\n  metadata: Object.metadata{\n    labels: {\"posture.acme.io/version\": object.metadata.labels['policy-as-versioned.dev/policy-version']}\n  }\n}"
