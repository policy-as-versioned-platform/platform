# A rendered FIXTURE, not a release. `selfcheck` is not a version: no element
# in distribution/versions.yaml declares it, no signed tag carries it, and the
# orphan-guard's allow-list is ranged from that same array, so a pod claiming
# it would be refused. Flux never delivers this tree.
#
# 2026-09-04 (ticket 63): it deliberately did NOT take the isolated-default
# flip. Two reasons. It serves nothing, so flipping it would change no
# admission decision anywhere. And it is now a live example of the ternary
# shape -- `nsGoverned ? 'isolated' : 'baseline'` -- that
# distribution/verify-infra-declaration.sh must keep reading correctly: once
# ticket 64 moves the three adopters' composed copies to 5.0.0, 4.0.0 and this
# fixture are the only served bodies left carrying it, and a regex with no live
# subject is a regex that rots. It is scanned by that check like every other
# served body and reports `baseline`, which is the truth about it.
#
# Self-scopes via matchConditions on the policy-version label -- NOT
# matchConstraints.objectSelector, which Kyverno flattens into one shared
# ValidatingWebhookConfiguration (last-reconciled-wins) and silently breaks
# multi-version coexistence.
apiVersion: policies.kyverno.io/v1alpha1
kind: MutatingPolicy
metadata:
  name: cage-tier-selfcheck
  labels:
    app.kubernetes.io/part-of: platform
    policy-as-versioned.dev/policy: graded-enforcement
    policy-as-versioned.dev/policy-version: selfcheck
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: claims-a-policy-version
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') != ''
  - name: only-this-policy-version
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') == 'selfcheck'
  variables:
  - name: nsGoverned
    expression: namespaceObject != null && namespaceObject.metadata.?labels['policy-as-versioned.dev/governed'].orValue('') == 'true'
  - name: nsTier
    expression: "namespaceObject != null\n  ? namespaceObject.metadata.?labels['posture.acme.io/tier'].orValue('')\n  : ''"
  - name: tier
    expression: "variables.nsTier in ['baseline', 'restricted', 'quarantine', 'isolated']\n  ? variables.nsTier\n  : (variables.nsGoverned ? 'isolated' : 'baseline')"
  - name: dial
    expression: "{'baseline':  {'cpu':'500m','mem':'256Mi','pc':'cage-baseline-selfcheck',  'prio':'-10',   'harden':'false','wafCpu':'0',   'wafMem':'0'},\n 'restricted':{'cpu':'250m','mem':'128Mi','pc':'cage-restricted-selfcheck','prio':'-100',  'harden':'true', 'wafCpu':'100m','wafMem':'128Mi'},\n 'quarantine':{'cpu':'100m','mem':'64Mi', 'pc':'cage-quarantine-selfcheck','prio':'-1000', 'harden':'true', 'wafCpu':'250m','wafMem':'256Mi'},\n 'isolated':  {'cpu':'100m','mem':'64Mi', 'pc':'cage-isolated-selfcheck',  'prio':'-10000','harden':'true', 'wafCpu':'250m','wafMem':'256Mi'}}[variables.tier]"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{\n  metadata: Object.metadata{ labels: {\n    \"posture.acme.io/caged\": \"true\",\n    \"posture.acme.io/tier\": variables.tier\n  } },\n  spec: Object.spec{\n    priorityClassName: variables.dial.pc,\n    priority: int(variables.dial.prio),\n    preemptionPolicy: \"Never\",\n    containers: object.spec.containers.map(c, Object.spec.containers{\n      name: c.name,\n      resources: Object.spec.containers.resources{\n        limits: {\"cpu\": variables.dial.cpu, \"memory\": variables.dial.mem}\n      },\n      securityContext: Object.spec.containers.securityContext{\n        readOnlyRootFilesystem: variables.dial.harden == 'true' ||\n          (has(c.securityContext) && c.securityContext.?readOnlyRootFilesystem.orValue(false)),\n        runAsNonRoot: variables.dial.harden == 'true' ||\n          (has(c.securityContext) && c.securityContext.?runAsNonRoot.orValue(false)),\n        allowPrivilegeEscalation: false\n      }\n    }) + (variables.dial.wafCpu != '0' ? [Object.spec.containers{\n      name: \"waf-sidecar\",\n      image: \"ghcr.io/acme/coraza-waf:cage\",\n      resources: Object.spec.containers.resources{\n        limits: {\"cpu\": variables.dial.wafCpu, \"memory\": variables.dial.wafMem}\n      },\n      securityContext: Object.spec.containers.securityContext{\n        readOnlyRootFilesystem: true, runAsNonRoot: true, allowPrivilegeEscalation: false\n      }\n    }] : [])\n  }\n}"
  - patchType: JSONPatch
    jsonPatch:
      expression: "variables.dial.harden == 'true'\n  ? object.spec.containers.map(c,\n      JSONPatch{\n        op: \"add\",\n        path: \"/spec/containers/\" + string(object.spec.containers.indexOf(c)) + \"/securityContext/capabilities\",\n        value: {\"drop\": [\"ALL\"]}\n      })\n  : []"
