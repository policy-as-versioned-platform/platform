# Self-scopes via matchConditions on the policy-version label -- NOT
# matchConstraints.objectSelector, which Kyverno flattens into one shared
# ValidatingWebhookConfiguration (last-reconciled-wins) and silently breaks
# multi-version coexistence.
apiVersion: policies.kyverno.io/v1alpha1
kind: GeneratingPolicy
metadata:
  name: cage-netpol-selfcheck
  labels:
    app.kubernetes.io/part-of: platform
    policy-as-versioned.dev/policy: graded-enforcement
    policy-as-versioned.dev/policy-version: selfcheck
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: is-caged
    expression: object.metadata.?labels['posture.acme.io/caged'].orValue('') == 'true'
  - name: tier-restricts-reach
    expression: object.metadata.?labels['posture.acme.io/tier'].orValue('baseline') != 'baseline'
  - name: only-this-policy-version
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') == 'selfcheck'
  variables:
  - name: nsName
    expression: string(object.metadata.namespace)
  - name: tier
    expression: object.metadata.?labels['posture.acme.io/tier'].orValue('baseline')
  - name: reach
    expression: "variables.tier == 'isolated'\n  ? {'ingress': dyn([]), 'egress': dyn([])}\n  : {'ingress': dyn([dyn({\"from\": dyn([dyn({\"podSelector\": dyn({})})])})]),\n     'egress':  dyn([dyn({\n       \"to\": dyn([dyn({\"namespaceSelector\": dyn({\"matchLabels\": dyn({\"kubernetes.io/metadata.name\": dyn(\"kube-system\")})})})]),\n       \"ports\": dyn([dyn({\"protocol\": dyn(\"UDP\"), \"port\": dyn(53)})])})])}"
  generate:
  - expression: "generator.Apply(variables.nsName, [dyn({\n  \"apiVersion\": dyn(\"networking.k8s.io/v1\"),\n  \"kind\": dyn(\"NetworkPolicy\"),\n  \"metadata\": dyn({\"name\": dyn(\"cage-reach-\" + variables.tier), \"namespace\": dyn(variables.nsName),\n               \"labels\": dyn({\"app.kubernetes.io/managed-by\": dyn(\"kyverno\"),\n                              \"posture.acme.io/cage\": dyn(\"reach\"),\n                              \"posture.acme.io/tier\": dyn(variables.tier)})}),\n  \"spec\": dyn({\n    \"podSelector\": dyn({\"matchLabels\": dyn({\"posture.acme.io/caged\": dyn(\"true\"),\n                                            \"posture.acme.io/tier\": dyn(variables.tier)})}),\n    \"policyTypes\": dyn([\"Ingress\", \"Egress\"]),\n    \"ingress\": dyn(variables.reach.ingress),\n    \"egress\": dyn(variables.reach.egress)})})\n])"
