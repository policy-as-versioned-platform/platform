# The version fan-out — the single edit that installs or retires a policy version.
#
# One `inputs[0].versions[]` array is the whole contract. flux-operator's
# ResourceSet renders it (once, ranging the array) into, per version:
#   * a GitRepository pinned to that version's SIGNED tag (+commit at release),
#   * a Kustomization that reconciles that version's policy path (prune: true),
# plus ONE catch-all orphan-guard ValidatingPolicy whose CEL allow-list is
# ranged from the SAME array — so the set of runnable versions cannot drift from
# the set the array declares. Add an element -> the version installs. Delete an
# element -> Flux prunes its objects AND the orphan-guard stops allowing it.
#
# The array here IS the "supported versions" contract the shift-left check reads
# (ticket 12) — no separate discovery endpoint. `render-orphan-guard.py` is the
# offline twin of the orphan-guard render below (used by the verify-*.sh beats
# and shift-left, where flux-operator isn't in the loop); both range this array.
#
# NB flux-operator renders resources ONCE PER input element, with `range` only
# over fields *within* one element — so the array lives inside a single input's
# `versions` field, and the template ranges it. That is the only shape that lets
# one orphan-guard see every version.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: policy-versions
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: platform
spec:
  inputs:
    - versions:
        # RETIRED 2026-08-29 -- 2.0.0, 2.0.1, 3.0.0 and the two patch backports
        # 2.0.2 and 3.0.1 were all here. Two independent reasons, both observed:
        #
        #   1. Not deployable. Every 2.x/3.x cage-tier writes
        #      spec.priorityClassName from a mutating webhook without the
        #      spec.priority and spec.preemptionPolicy the Priority admission
        #      plugin re-derives from that same class, so the plugin refuses the
        #      pod because the fields disagree. An adopter pinned to one of them
        #      could not deploy at all. The 2.0.2/3.0.1 backports repaired
        #      exactly that triple, and nothing else.
        #
        #   2. Not safe, and unfixable as a patch. Every pre-ADR-0022 body reads
        #      the tier from the POD's own label. Observed live on kind-driftwood
        #      once the backports made pods creatable again: in Namespace
        #      driftwood, which declares posture.acme.io/tier=isolated, a pod
        #      claiming 2.0.2 and forging posture.acme.io/tier=baseline was
        #      admitted as baseline with hostNetwork=true and reached the API
        #      server; the identical pod claiming 4.0.0 was clobbered to
        #      isolated, hostNetwork=false, and reached nothing. Teaching a 2.x
        #      or 3.x body to read namespaceObject IS ADR-0022, which the engine
        #      classifies major -- so it cannot be a patch on those lines, and
        #      ADR-0011 refuses a declaration weaker than the computed one. The
        #      honest repair is retirement, not a number.
        #
        # Deleting the element is the estate's own retirement mechanism
        # (verify-retirement.sh): Flux prunes each Kustomization and the orphan
        # guard stops allowing the version. The RELEASED trees for 2.0.0, 2.0.1
        # and 3.0.0 stay on disk and behind their signed tags, unedited -- a
        # released tree is frozen and history is not rewritten. The 2.0.2 and
        # 3.0.1 backport trees were never cut and are gone. See README.md.
        #
        # 4.0.0 -- the cage release (ticket 26, ADR-0022): the tier moves to the
        # governed Namespace and is read through namespaceObject, the pod label
        # becomes an output, the cage is tighten-only, the `isolated` rung and
        # its PriorityClass land, reach is generated per tier, and the mutation
        # writes the priority PAIR (priorityClassName + the class's own integer)
        # without which the API server's Priority admission plugin refuses the
        # pod. `commit` is deliberately absent: the ResourceSet template makes it
        # optional, and it is filled in when cut-release.yml cuts the signed tag.
        # `bump` is the DECLARED bump (ticket 43, ticket 18 Answer 5): the
        # reviewed array element is where the publisher declares what kind of
        # change this release is, and cut-release-gate.py reads it and refuses
        # if the number the tag steps disagrees. Before this field the "declared"
        # bump was derived from the tag arithmetic, so it could never disagree
        # with itself. major: the cage tier moved to the governed Namespace and
        # the pod label became an output -- every 3.0.0 consumer must act.
        - { version: "4.0.0", tag: "policy/v4.0.0", commit: "64635dfdff3a835e7b0c2e51eae0650951ef2607", bump: "major" }
        #
        # 5.0.0 -- the isolated-default release (ticket 63, ADR-0022). Two
        # things move, and only the first is why it is a major:
        #
        #   * cage-tier's unlabelled tier default flips from `baseline` to
        #     `isolated`. An UNGOVERNED Namespace used to buy a nudge by saying
        #     nothing; now silence is the bottom rung, like every other silence
        #     in this estate. ADR-0022's ordering rule held that flip back until
        #     the platform's own `infra` declaration on
        #     kube-system/flux-system/kyverno had landed AND the truth surface
        #     asserted it, or CoreDNS would fall to `isolated` and the cluster
        #     would stop. verify-infra-declaration.sh is that assertion and it
        #     passes, so the precondition is met and the flip ships. It stays a
        #     tripwire afterwards: pull an infra declaration while this default
        #     reads `isolated` and that check FAILS.
        #
        #     Every 4.0.0 consumer must act -- a namespace that was ungoverned
        #     and running normally is now caged to the bottom rung, so this
        #     cannot be a minor or a patch, and ADR-0011 refuses a declaration
        #     weaker than the computed one. The engine agrees on its own:
        #     computed-semver classifies the tier-default move as major without
        #     being told (verify-rederive-bumps.sh).
        #
        #   * require-nonroot RE-CARRIES the root-if-attested conditional arm,
        #     folded into its own body exactly as the retired 2.0.1 folded it.
        #     Principle 1's first arm -- a rule may widen for a CONDITION,
        #     uniformly, never for a named team -- lived only in 2.0.1, and
        #     2.0.1 is retired, so nothing served demonstrated it (ticket 58
        #     Q2a). That member widens and narrows nothing, so it contributes
        #     no bump of its own.
        #
        # This is also the SECOND DECLARED LINE (ticket 58 Q1a). Since the
        # 2026-08-29 retirement the array has declared exactly one version, so
        # coexistence, retirement and the +/-1 window had no live subject at all
        # -- verify-coexistence.sh could only read could-not-look. 4.0.0 stays
        # declared beside it: that is the point. Ticket 84 supplies the third
        # line (ticket 75 Q3: at least three coexisting versions, forward and
        # back by one, in the owner's own 2022 words) and the supersede pricing
        # that makes an older line cost something.
        #
        # `commit` is deliberately absent, as 4.0.0's was before its release:
        # the ResourceSet template makes it optional and cut-release.yml fills
        # it in when it cuts the SIGNED tag. Until that dispatch happens this
        # element is an UNCUT TAIL -- policy/v5.0.0 does not exist, so Flux
        # cannot deliver it and no cluster can be carrying it. An agent never
        # fakes a tag, a signature or a commit hash, so the field stays empty
        # and the live-tail checks could-not-look by name rather than reporting
        # a defect that is really an unmade release.
        - { version: "5.0.0", tag: "policy/v5.0.0", bump: "major" }
  resourcesTemplate: |
    << range $v := (index (inputs) "versions") >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    metadata:
      name: policy-v<< $v.version | slugify >>
      namespace: flux-system
    spec:
      interval: 1m
      url: https://github.com/policy-as-versioned-platform/platform
      ref:
        tag: << $v.tag | quote >>
        << if $v.commit >>commit: << $v.commit | quote >><< end >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: policy-v<< $v.version | slugify >>
      namespace: flux-system
    spec:
      interval: 5m
      retryInterval: 1m
      timeout: 3m
      sourceRef:
        kind: GitRepository
        name: policy-v<< $v.version | slugify >>
      path: ./distribution/policies/v<< $v.version >>
      prune: true    # retire == delete the array element -> this Kustomization
                     # vanishes -> its policy objects are pruned.
      wait: true
    << end >>
    ---
    # The orphan-guard: rendered ONCE, allow-list ranged from the SAME array.
    #
    # ECO-SYSTEM TICKET 89 (2026-09-05): `Audit`, not `Deny`. The owner's words (2026-09-02,
    # ticket 75 Q5): something can be unable to run only because it does not fit the cage,
    # never because it is deliberately denied. An orphan claim is admitted and CAGED --
    # cage-tier matches every claiming pod and renders its Namespace's declared tier, falling
    # closed to `isolated` -- and the versioned rules it escapes are a priced hole (ADR-0026),
    # which this report is the observation for. See render-orphan-guard.py's docstring for why
    # selecting the bottom rung for an orphan claim belongs inside cage-tier and not in a
    # second mutating policy beside it.
    #
    # This body and its offline twin (render-orphan-guard.py) are asserted EQUAL by that
    # twin's --selfcheck. They were not, before this ticket: the twin carried the
    # platform-machinery identity label and this copy did not.
    apiVersion: policies.kyverno.io/v1alpha1
    kind: ValidatingPolicy
    metadata:
      name: policy-version-orphan-guard
      labels:
        policy-as-versioned.dev/policy: platform-machinery
    spec:
      validationActions:
      - Audit
      matchConstraints:
        resourceRules:
        - apiGroups:
          - ''
          apiVersions:
          - v1
          operations:
          - CREATE
          - UPDATE
          resources:
          - pods
      matchConditions:
      - name: has-policy-version-label
        expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') != ''
      variables:
      - name: allowed
        expression: "[<< range $i, $v := (index (inputs) "versions") >><< if $i >>, << end >>'<< $v.version >>'<< end >>]"
      - name: claimed
        expression: object.metadata.labels['policy-as-versioned.dev/policy-version']
      validations:
      - expression: variables.allowed.exists(v, v == variables.claimed)
        message: 'policy-version not in the platform-declared version array (orphan): no ResourceSet element declares it, so no served policy version governs this pod. It runs, caged at its Namespace''s declared tier, and the rules it escapes are a priced hole (ADR-0026). Nothing is denied.'
    ---
    # The governed-namespace cage (ADR-0014's fifth named gap): rendered ONCE, beside the
    # orphan-guard above and not inside it. No dependency on the version array -- static,
    # unlike the orphan-guard -- so it needs no `range`. Offline twin:
    # render-governed-namespace-guard.py (same split, same reason: verify-*.sh and shift-left
    # run without flux-operator in the loop), which is where the reasoning lives.
    #
    # ECO-SYSTEM TICKET 89 (2026-09-05): a MutatingPolicy, not a Deny. ADR-0022's addendum of
    # 2026-08-28 promoted this to `Deny` and called it "the one refusal the doctrine allows",
    # for a reason observed live: under `Audit` a claim-less pod ran completely uncaged inside
    # a Namespace whose declared tier was `isolated`. The mutation answers the reason without
    # the refusal -- the pod is admitted onto the BOTTOM RUNG, so the Namespace falls closed
    # and the pod falls closed. Silence is not an exemption; silence is the bottom rung.
    #
    # The mutation body below is cage-tier's OWN, copied by the twin with `tier` pinned to
    # 'isolated' -- one dial table, one CEL expansion, no third copy. CREATE only: on an
    # UPDATE this mutation would inject a waf-sidecar into an immutable container list and the
    # API server would reject the de-posture patch, which is the cage becoming a refusal by
    # another name (observed live 2026-08-28, ticket 26).
    apiVersion: policies.kyverno.io/v1alpha1
    kind: MutatingPolicy
    metadata:
      name: governed-namespace-requires-claim
      labels:
        policy-as-versioned.dev/policy: platform-machinery
    spec:
      matchConstraints:
        resourceRules:
        - apiGroups:
          - ''
          apiVersions:
          - v1
          operations:
          - CREATE
          resources:
          - pods
        namespaceSelector:
          matchLabels:
            policy-as-versioned.dev/governed: 'true'
      matchConditions:
      - name: claims-no-policy-version
        expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') == ''
      variables:
      - name: tier
        expression: '''isolated'''
      - name: dial
        expression: "{'baseline':  {'cpu':'500m','mem':'256Mi','pc':'cage-baseline',  'prio':'-10',   'harden':'false','wafCpu':'0',   'wafMem':'0'},\n 'restricted':{'cpu':'250m','mem':'128Mi','pc':'cage-restricted','prio':'-100',  'harden':'true', 'wafCpu':'100m','wafMem':'128Mi'},\n 'quarantine':{'cpu':'100m','mem':'64Mi', 'pc':'cage-quarantine','prio':'-1000', 'harden':'true', 'wafCpu':'250m','wafMem':'256Mi'},\n 'isolated':  {'cpu':'100m','mem':'64Mi', 'pc':'cage-isolated',  'prio':'-10000','harden':'true', 'wafCpu':'250m','wafMem':'256Mi'}}[variables.tier]"
      mutations:
      - patchType: ApplyConfiguration
        applyConfiguration:
          expression: "Object{\n  metadata: Object.metadata{ labels: {\n    \"posture.acme.io/caged\": \"true\",\n    \"posture.acme.io/tier\": variables.tier\n  } },\n  spec: Object.spec{\n    hostNetwork: false,\n    hostPID: false,\n    hostIPC: false,\n    priorityClassName: variables.dial.pc,\n    priority: int(variables.dial.prio),\n    preemptionPolicy: \"Never\",\n    containers: object.spec.containers.filter(c, c.name != \"waf-sidecar\").map(c, Object.spec.containers{\n      name: c.name,\n      resources: Object.spec.containers.resources{\n        limits: {\n          \"cpu\": (has(c.resources) && c.resources.?limits[\"cpu\"].hasValue() &&\n                  quantity(string(c.resources.limits[\"cpu\"])).isLessThan(quantity(variables.dial.cpu)))\n                   ? string(c.resources.limits[\"cpu\"]) : variables.dial.cpu,\n          \"memory\": (has(c.resources) && c.resources.?limits[\"memory\"].hasValue() &&\n                  quantity(string(c.resources.limits[\"memory\"])).isLessThan(quantity(variables.dial.mem)))\n\
            \                   ? string(c.resources.limits[\"memory\"]) : variables.dial.mem\n        }\n      },\n      securityContext: Object.spec.containers.securityContext{\n        readOnlyRootFilesystem: variables.dial.harden == 'true' ||\n          (has(c.securityContext) && c.securityContext.?readOnlyRootFilesystem.orValue(false)),\n        runAsNonRoot: variables.dial.harden == 'true' ||\n          (has(c.securityContext) && c.securityContext.?runAsNonRoot.orValue(false)),\n        allowPrivilegeEscalation: false,\n        privileged: false\n      }\n    }) + (variables.dial.wafCpu != '0' ? [Object.spec.containers{\n      name: \"waf-sidecar\",\n      image: \"ghcr.io/acme/coraza-waf:cage\",\n      resources: Object.spec.containers.resources{\n        limits: {\"cpu\": variables.dial.wafCpu, \"memory\": variables.dial.wafMem}\n      },\n      securityContext: Object.spec.containers.securityContext{\n        readOnlyRootFilesystem: true, runAsNonRoot: true,\n        allowPrivilegeEscalation:\
            \ false, privileged: false\n      }\n    }] : [])\n  }\n}"
      - patchType: JSONPatch
        jsonPatch:
          expression: "variables.dial.harden == 'true'\n  ? object.spec.containers.map(c,\n      JSONPatch{\n        op: \"add\",\n        path: \"/spec/containers/\" + string(object.spec.containers.indexOf(c)) + \"/securityContext/capabilities\",\n        value: {\"drop\": [\"ALL\"]}\n      })\n  : []"
