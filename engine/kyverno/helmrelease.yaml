# Kyverno — the admission engine (ADR-0003). Every `ValidatingPolicy` /
# `MutatingPolicy` in this repo (distribution's orphan-guard, the posture
# stamp + trust-boundary, graded's cage policies, ...) needs this controller
# installed before it can admit anything. Nothing in the repo installed it
# until this ticket (11) — `estate/driftwood/README.md` and
# `estate/platform/distribution/README.md` named it as a prerequisite without
# ever shipping the HelmRelease. Ordered before the posture layer: see
# `estate/talk/up.sh`.
#
# The chart version names an exact engine: chart 3.8.2 carries appVersion
# v1.18.2, and engine/kyverno/engine-table.yaml records that mapping with its
# source. Hub ADR-0033 supersedes ADR-0003's ">=1.18" floor: a policy line
# supports exactly the engines in its `tested_engines`, and no range is
# inferred. This reference install must be a supported engine of every served
# line and of the machinery, and the hub's verify/engine-pins check maps this
# chart version back through the table's chart column to assert it. A bump is a
# reviewed PR that adds the engine to the table, and to the lines it passes on,
# first (ADR-0033 point 5). ADR-0009's live proof ran on 1.18.2 too. Default
# chart values already install the `policies.kyverno.io` CRD group
# (`ValidatingPolicy`/`MutatingPolicy`), so no values override is needed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"          # appVersion v1.18.2, per engine/kyverno/engine-table.yaml
      sourceRef: { kind: HelmRepository, name: kyverno }
  install: { crds: Create }
  upgrade: { crds: CreateReplace }
