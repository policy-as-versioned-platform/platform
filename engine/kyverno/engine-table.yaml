# The engine table: every Kyverno version the estate may run (hub ADR-0033 point 4,
# eco-system ticket 146 item 1).
#
# One row per exact version. A row says where each artefact comes from and what its bytes
# hash to. It does not say that any policy line supports the version: a line supports exactly
# the engines in its own `tested_engines` (distribution/versions.yaml), and the machinery the
# composer renders supports exactly the engines in distribution/machinery.yaml. A version is in
# this table so that a grader, a workflow or an adopter can install it by checksum. Nothing is
# inferred from it about a neighbouring patch.
#
# WHO READS IT (computed-semver/engine_compatibility.py does not: it identifies each binary it is
# handed by running it)
#   engine/install-kyverno-engines.sh        installs every row's CLI by checksum (cut-release.yml,
#                                            a local run).
#   graded/verify-graded.sh                  refuses to grade on a CLI whose version is not a row.
#   hub .github/workflows/truth.yml          installs every row's linux_x86_64 CLI by checksum and
#                                            hands one binary per engine to the cage-engine check.
#   hub verify/estate-engines/               each estate pin must name a row here, carry the
#                                            row's checksum, and be a supported engine of every
#                                            served line and of the machinery.
#   ticket 147 (adopters)                    an adopter's gitops/engine/kyverno.yaml must agree
#                                            with the row for its version.
#
# WHERE EACH FIGURE COMES FROM. Nothing here is typed from memory.
#   cli        the release's own checksums.txt, at `checksums`. Cross-checked 2026-09-26 against
#              the GitHub release API's `digest` for the same asset, and against the pins the
#              workflows already carried: hub truth.yml, platform release.yml and cut-release.yml
#              (linux_x86_64, cb2feb83...). darwin_arm64 is the platform the owner's Mac runs.
#   install    NOT in the release's checksums.txt (that file lists the CLI archives only). The
#              sha256 is the GitHub release API's `digest` for the install.yaml asset, the sha256
#              of the downloaded file measured 2026-09-26, and the pin each adopter's
#              drift-sample.yml already carried (3dcd43ea...). All three agree.
#   chart      the Kyverno Helm repository index, at `index`: chart 3.8.2 carries appVersion
#              v1.18.2 there. `digest` is the index's own sha256 for kyverno-3.8.2.tgz. The
#              platform's reference install, engine/kyverno/helmrelease.yaml, names the chart
#              version, and a pin check maps it back to this row through `chart.version`.
#
# TO ADD A VERSION: a reviewed PR that adds a row with every figure taken from that release's
# own files, and records where each came from, as above. Adding a row supports nothing. A line
# supports the version only when the same change, or a later one, adds it to the line's
# `tested_engines` and the grader passes every new cell (ADR-0033 point 5).
#
# THE 1.19.1 ROW (eco-system ticket 148, 2026-09-26). Each figure was read and cross-checked on
# 2026-09-26 the way the 1.18.2 row's were:
#   cli        both archives' sha256 from v1.19.1's own checksums.txt (itself sha256 ef46faa1...,
#              the release API's digest for that asset). Each equals the release API's `digest`
#              for the archive, and the downloaded darwin_arm64 and linux_x86_64 archives hash to
#              it. The darwin_arm64 binary reports Version 1.19.1, git commit 40ec788d.
#   install    the release API's `digest` for v1.19.1's install.yaml, which checksums.txt does not
#              list. The downloaded file hashes to it. That install.yaml serves policies.kyverno.io
#              v1 for ValidatingPolicy, MutatingPolicy and GeneratingPolicy and marks v1alpha1
#              deprecated, as 1.18.2's does.
#   chart      the Kyverno Helm repository index, at `index`: chart 3.9.1 carries appVersion
#              v1.19.1 there, and `digest` is the index's sha256 for kyverno-3.9.1.tgz. The
#              downloaded chart hashes to it, and its Chart.yaml reads version 3.9.1, appVersion
#              v1.19.1. No platform install names this chart: the reference install stays 3.8.2.
# Only the machinery lists 1.19.1 (distribution/machinery.yaml). No policy line does: the 5.0.0
# cage-tier body does not compile on it (hub .scratch/ecosystem/research/kyverno-1.19-cage-diagnosis/).
