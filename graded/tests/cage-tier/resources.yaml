apiVersion: v1
kind: Pod
metadata:
  name: at-baseline
  namespace: cage-baseline
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: at-restricted
  namespace: cage-restricted
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: at-quarantine
  namespace: cage-quarantine
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: at-isolated
  namespace: cage-isolated
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: untiered-ns
  namespace: cage-untiered
  labels:
    policy-as-versioned.dev/policy-version: 2.0.0
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: forged-tier
  namespace: cage-quarantine
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
    posture.acme.io/tier: baseline
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: hardened-baseline
  namespace: cage-baseline
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: unclaimed-system
  namespace: kube-system
spec:
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  namespace: cage-baseline
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: host-namespaces
  namespace: cage-isolated
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: tighter-than-tier
  namespace: cage-baseline
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-resident
  namespace: cage-quarantine
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
spec:
  containers:
  - name: app
    image: nginx
  - name: waf-sidecar
    image: ghcr.io/acme/coraza-waf:cage
---
