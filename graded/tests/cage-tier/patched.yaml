apiVersion: v1
kind: Pod
metadata:
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
    posture.acme.io/caged: 'true'
    posture.acme.io/tier: baseline
  name: at-baseline
  namespace: cage-baseline
spec:
  containers:
  - image: nginx
    name: app
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: false
      runAsNonRoot: false
  hostIPC: false
  hostNetwork: false
  hostPID: false
  preemptionPolicy: Never
  priority: -10
  priorityClassName: cage-baseline
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
    posture.acme.io/caged: 'true'
    posture.acme.io/tier: restricted
  name: at-restricted
  namespace: cage-restricted
spec:
  containers:
  - image: nginx
    name: app
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
  - image: ghcr.io/acme/coraza-waf:cage
    name: waf-sidecar
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
  hostIPC: false
  hostNetwork: false
  hostPID: false
  preemptionPolicy: Never
  priority: -100
  priorityClassName: cage-restricted
---
