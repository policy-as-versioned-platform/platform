# Expected cages — the deterministic expansion of the tier each pod's NAMESPACE
# declares (cage.py holds the same table). Every pod is MUTATED (admitted) into
# its cage, never denied.
#
# Read the cases ticket 26 exists for straight off this file:
#   * `untiered-ns` sits in a governed namespace with NO tier and comes out
#     `isolated` — the strictest running cage — not `baseline`. Fail closed.
#   * `forged-tier` declared `baseline` on the pod and comes out `quarantine`,
#     the tier its Namespace declares. The pod label is an OUTPUT.
#   * `hardened-baseline` declared readOnlyRootFilesystem/runAsNonRoot TRUE at
#     the LOOSEST rung and keeps both TRUE. Tighten-only: the cage never writes
#     a security field looser than the workload asked for.
# And the five the 2026-08-28 review added, each of which was a live escape or a
# live refusal before this file grew a row for it:
#   * `privileged-pod` comes out `privileged: false` next to
#     `allowPrivilegeEscalation: false`, so the API server's own validation
#     accepts the pair instead of rejecting the pod the cage just wrote.
#   * `host-namespaces` comes out hostNetwork/hostPID/hostIPC ALL false at the
#     bottom rung — the reach projection is a NetworkPolicy and a host-network
#     pod is not subject to one.
#   * `tighter-than-tier` KEEPS its declared 50m/32Mi at a rung whose dial is
#     500m/256Mi. The ceilings are a MIN.
#   * `sidecar-resident` already had a `waf-sidecar` and comes out with exactly
#     ONE — the shape every UPDATE to a caged pod has.
#   * `ungoverned-ns` comes out `isolated` (ticket 63, 2026-09-04). It used to
#     come out `baseline`: ADR-0022's ordering rule held the strictest-cage
#     default back until the platform's own `infra` declaration on
#     kube-system/flux-system/kyverno had landed AND the truth surface asserted
#     it. Both are true now (distribution/verify-infra-declaration.sh is the
#     gating check and passes), so the unlabelled default is the bottom rung.
#     A namespace nobody governs no longer buys a nudge by saying nothing.
# And every pod carries all THREE fields the API server's own Priority admission
# plugin derives from a PriorityClass — `priorityClassName`, the matching integer
# `priority`, and `preemptionPolicy: Never` — without which it refuses the pod
# outright, whatever the cage says.
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
    posture.acme.io/caged: 'true'
    posture.acme.io/tier: baseline
  name: at-baseline
  namespace: cage-baseline
spec:
  containers:
  - image: nginx
    name: app
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: false
      runAsNonRoot: false
  hostIPC: false
  hostNetwork: false
  hostPID: false
  preemptionPolicy: Never
  priority: -10
  priorityClassName: cage-baseline
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    policy-as-versioned.dev/policy-version: 1.0.0
    posture.acme.io/caged: 'true'
    posture.acme.io/tier: restricted
  name: at-restricted
  namespace: cage-restricted
spec:
  containers:
  - image: nginx
    name: app
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
  - image: ghcr.io/acme/coraza-waf:cage
    name: waf-sidecar
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
  hostIPC: false
  hostNetwork: false
  hostPID: false
  preemptionPolicy: Never
  priority: -100
  priorityClassName: cage-restricted
