# Every caged non-baseline pod generates ALL THREE restricting rungs at once
# (repair of 2026-08-28): a tier move is then a pure label change, with nothing
# created or deleted in its path. baseline is absent — a nudge keeps its network.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cage-reach-restricted
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kyverno
    posture.acme.io/cage: reach
    posture.acme.io/tier: restricted
spec:
  podSelector:
    matchLabels:
      posture.acme.io/caged: "true"
      posture.acme.io/tier: restricted
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cage-reach-quarantine
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kyverno
    posture.acme.io/cage: reach
    posture.acme.io/tier: quarantine
spec:
  podSelector:
    matchLabels:
      posture.acme.io/caged: "true"
      posture.acme.io/tier: quarantine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cage-reach-isolated
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kyverno
    posture.acme.io/cage: reach
    posture.acme.io/tier: isolated
spec:
  podSelector:
    matchLabels:
      posture.acme.io/caged: "true"
      posture.acme.io/tier: isolated
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
