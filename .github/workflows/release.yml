name: release

# Runs on every semver tag push. Verifies the tag's gitsign signature
# identity-pinned (not just "a valid signature exists") against a persisted
# offline Rekor bundle, checks the tag still resolves to the commit this run
# was triggered from, runs the offline shift-left proof as a release gate,
# and publishes a GitHub Release. See cut-release.yml for how the tag gets
# here, and the hub repo's ADR-0001 / docs/adr/0001 for the full rationale.
#
# EXPECTED_IDENTITY_REGEXP anchors cut-release.yml's own Actions identity
# (ambient credential, no human login -- see that workflow's header comment
# for why) but allows either refs/heads/main or a release/<major>.<minor>.x
# maintenance branch, since a backport is dispatched from a maintenance
# branch, not main (ticket cs-14/cs-16). Both ends are anchored (^...$) and
# every literal `.` is escaped, so no foreign org/repo/path can sneak in.
#
# Also accepts workflow_dispatch: a workflow run started BY the default
# Actions credential (cut-release.yml's own `git push`) does not, by GitHub
# design, trigger other workflows -- the tag lands but this workflow's own
# `push: tags:` event never fires. workflow_dispatch is the documented way
# round that: verify+publish stays reachable for every tag, chained or not.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to verify + publish (workflow_dispatch path only)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
  KYVERNO_VERSION: 1.18.2
  KYVERNO_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
  EXPECTED_IDENTITY_REGEXP: ^https://github\.com/policy-as-versioned-platform/platform/\.github/workflows/cut-release\.yml@refs/heads/(main|release/[0-9]+\.[0-9]+\.x)$
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: install pinned gitsign + kyverno (binary + checksum, no marketplace actions)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign

          curl -sSL -o kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
          tar xzf kyverno.tar.gz kyverno && chmod +x kyverno && sudo mv kyverno /usr/local/bin/kyverno

          pip install --quiet pyyaml

      - name: shift-left offline proof (release gate)
        # ponytail: this is the one offline, no-cluster proof exercised as a
        # release gate -- the rest of platform's verify-*.sh beats need a live
        # KiND cluster and run elsewhere, not on every tag push.
        run: ./shift-left/verify-shift-left.sh

      - name: gitsign verify-tag, identity-pinned, offline Rekor bundle
        env:
          GITSIGN_REKOR_MODE: offline
        run: |
          set -euo pipefail
          # actions/checkout's second fetch (it resolves the trigger ref to a
          # SHA for checkout) force-overwrites the local refs/tags/<name> to
          # point straight at the commit, flattening the annotated tag object
          # gitsign needs. Re-fetch the real tag ref before verifying it.
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --force
          gitsign verify-tag "${TAG}" \
            --certificate-identity-regexp="${EXPECTED_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer="${EXPECTED_ISSUER}"

      - name: tag still resolves to the commit this run was triggered from
        # Only meaningful on the push-triggered path: GITHUB_SHA there IS the
        # tag's commit. On workflow_dispatch (the chain-broken fallback
        # above) GITHUB_SHA is the branch tip this run happened to start
        # from, not the tag -- comparing them would be a false failure, not
        # a real check, so this step is scoped to the event it actually
        # tests.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          resolved=$(git rev-parse "${TAG}^{commit}")
          if [ "${resolved}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: tag ${TAG} resolves to ${resolved}, run was triggered from ${GITHUB_SHA}"
            exit 1
          fi
          echo "OK: ${TAG} -> ${resolved}"

      - name: publish GitHub Release recording the resolved SHA
        run: |
          set -euo pipefail
          resolved=$(git rev-parse "${TAG}^{commit}")
          # The annotated tag's own message is the "what changed and why" a
          # release cutter wrote by hand (cut-release.yml's `message` input)
          # -- carry it into the release notes; gitsign appends a signed
          # message block to the tag's own message (the signature itself)
          # -- strip it so the release body carries the narrative only.
          {
            git tag -l --format='%(contents)' "${TAG}" | sed '/^-----BEGIN SIGNED MESSAGE-----$/,$d'
            echo "---"
            echo "Verified gitsign signature (identity regexp: ${EXPECTED_IDENTITY_REGEXP}, issuer: ${EXPECTED_ISSUER}). Resolved commit: ${resolved}."
          } > release-notes.md
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
