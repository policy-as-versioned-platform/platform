# An institution dev's workload PR, pinned to policy-version 2.0.0. Compliant
# with 2.0.0's own rule (runAsNonRoot) but NOT its neighbor 3.0.0's tightened
# rule (no readOnlyRootFilesystem). Today both are Audit, so this would deploy
# fine live -- but the shift-left check runs the whole declared ±1 window
# regardless of Audit/Deny, so it catches this before the dev ever drifts onto
# 3.0.0's pin, or before either version's Audit is promoted to Deny (the
# Audit->Deny flip, ADR-0006: promotion is editorial, never a timer).
apiVersion: v1
kind: Pod
metadata: { name: checkout-svc, labels: { "policy-as-versioned.dev/policy-version": "2.0.0" } }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx }]
