# The reference: two pods outside the cage. The probe connects from client to sink to show the network works.
apiVersion: v1
kind: Namespace
metadata:
  name: loop-reference
---
apiVersion: v1
kind: Pod
metadata:
  name: sink
  namespace: loop-reference
  labels: { app: sink }
spec:
  containers:
    - name: c
      image: nginx@sha256:abe47724e466aeab9a345d8e46a221c2fa8953c7848bb4a3bd9976a7199f8cf2
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: loop-reference
spec:
  containers:
    - name: c
      image: nginx@sha256:abe47724e466aeab9a345d8e46a221c2fa8953c7848bb4a3bd9976a7199f8cf2
---
apiVersion: v1
kind: Service
metadata:
  name: sink
  namespace: loop-reference
spec:
  selector: { app: sink }
  ports: [{ port: 80 }]
