# Smart-HTTP git, read-only, no auth: the served tree is this repo's own
# checkout, reachable only inside the KinD cluster. Identical shape to
# driftwood/git-server/lighttpd.conf.
server.modules = ("mod_alias", "mod_cgi", "mod_setenv")
server.document-root = "/www"
server.port = 8080
$HTTP["url"] =~ "^/cgi-bin/git" {
    alias.url = ("/cgi-bin/git" => "/usr/lib/git-core/git-http-backend")
    cgi.assign = ("" => "")
    setenv.add-environment = (
        "GIT_PROJECT_ROOT" => "/srv/git",
        "GIT_HTTP_EXPORT_ALL" => "1",
    )
}
