# The gitsign-verifying source controller.
#
# TIME-BOXED. This Deployment exists only because Flux cannot verify a gitsign
# tag: source-controller v1.9.3 answers `unsupported signature type: x509`, and
# with `spec.ref.commit` set it will not even try (`cannot verify tag object's
# signature if a tag reference is not specified`). Both were observed live on
# kind-driftwood on 2026-08-28 and are recorded, with the raw conditions, in
# ../../distribution/verify/PRECONDITION-h6-12.md.
#
# WHAT REMOVES IT (ADR-0023 D3, ticket 16 Q4):
#   * fluxcd/source-controller#1068 lands, or
#   * GitRepository.spec.verify grows a sigstore/x509 mode by any other route.
# Both show up as ONE observation: the `spec.verify.mode` enum on the
# GitRepository CRD stops being exactly [HEAD, Tag, TagAndHEAD]. When it does,
# `platform/verify-source-verification.sh` goes RED and tells you to delete
# this directory, move the pins onto `spec.verify`, and drop the annotations.
# That verify script is the only thing that will tell you; nothing else is
# watching #1068.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitsign-verifier
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/name: gitsign-verifier
  annotations:
    policy-as-versioned.dev/time-boxed-until: "fluxcd/source-controller#1068"
    policy-as-versioned.dev/removal-verified-by: platform/verify-source-verification.sh
    # The named ceiling, where a reader of the LIVE object will see it and not only a reader of
    # the README: this pod carries no gitsign binary, so it checks the Fulcio certificate chain,
    # the identity and the issuer, and NOT the Rekor signed entry timestamp or inclusion proof.
    # A certificate for the pinned identity that was never logged passes here and fails
    # `gitsign verify-tag`. verify-source-verification.sh section 6 runs that differential
    # wherever gitsign is installed; at runtime, in here, the Rekor half is simply not looked at.
    policy-as-versioned.dev/ceiling: "no transparency-log check; see README.md, Ceilings"
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gitsign-verifier }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitsign-verifier
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: gitsign-verifier
      # ponytail: a stock image plus `apk add git openssl` at start, NOT a
      # built one, because this estate cuts no image and this controller is
      # meant to die before it earns a release train of its own. The ceiling:
      # the pod needs egress to the alpine mirrors on start and runs as root
      # to install, which is why readOnlyRootFilesystem is false here and
      # true nowhere else in this package. The upgrade path, if the time-box
      # outlives its welcome: cut-release.yml builds and gitsign-signs an
      # image holding python3 + git + openssl + verify_gitsign.py, this
      # becomes a pinned digest, and the securityContext tightens to
      # runAsNonRoot with a read-only root.
      containers:
        - name: verifier
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache git openssl >/dev/null
              exec python3 /app/verify_gitsign.py controller --interval "${INTERVAL}"
          env:
            - name: INTERVAL
              value: "60"          # knob: below the Kustomization interval, above the fetch cost
            - name: GITSIGN_CACHE
              value: /cache
          volumeMounts:
            - { name: verifier, mountPath: /app }
            - { name: cache, mountPath: /cache }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        # ONE copy of the program. The ConfigMap is generated by kustomize
        # from verify_gitsign.py and the two Fulcio PEMs beside it, so the
        # thing running in the cluster is the same bytes
        # verify-source-verification.sh proves offline -- not a transcription.
        - name: verifier
          configMap: { name: gitsign-verifier }
        - name: cache
          emptyDir: {}
