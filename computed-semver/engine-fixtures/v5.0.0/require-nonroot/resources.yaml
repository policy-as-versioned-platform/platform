apiVersion: v1
kind: Pod
metadata: { name: pod-compliant, labels: { "policy-as-versioned.dev/policy-version": "5.0.0" } }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx, securityContext: { readOnlyRootFilesystem: true } }]
---
apiVersion: v1
kind: Pod
metadata: { name: pod-violating, labels: { "policy-as-versioned.dev/policy-version": "5.0.0" } }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-root-attested
  labels:
    policy-as-versioned.dev/policy-version: "5.0.0"
    policy-as-versioned.dev/root-attestation: "sec-review-2026-09-04"
spec:
  containers:
    - name: c
      image: nginx
      securityContext: { readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Pod
metadata: { name: pod-root-unattested, labels: { "policy-as-versioned.dev/policy-version": "5.0.0" } }
spec:
  containers:
    - name: c
      image: nginx
      securityContext: { readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
# Violates 5.0.0's rule, but claims another version, so this body must not judge it.
apiVersion: v1
kind: Pod
metadata: { name: pod-other-version, labels: { "policy-as-versioned.dev/policy-version": "4.0.0" } }
spec:
  containers: [{ name: c, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata: { name: pod-unversioned }
spec:
  containers: [{ name: c, image: nginx }]
