# values.yaml declares the two Namespaces, so the CLI evaluates the body's namespaceSelector.
# Without it every row read Pass / Excluded whatever it asserted (measured 2026-09-26), and the
# grader now refuses a pass or fail row that reads Excluded. This folder grades both what the
# body does to an unclaimed pod in a governed Namespace and that it leaves the same pod alone in
# a Namespace that is not governed.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: governed-namespace-requires-claim-engine
policies:
  - rendered by the grader from the graded commit
resources:
  - resources.yaml
variables: values.yaml
results:
  # a pod that claims nothing in a governed Namespace lands on the bottom rung, caged and not
  # denied, with its initContainer hardened too.
  - policy: governed-namespace-requires-claim
    kind: Pod
    resources: [unclaimed-governed]
    patchedResources: patched.yaml
    result: pass
  # a pod that claims a version is cage-tier's, not this policy's.
  - policy: governed-namespace-requires-claim
    kind: Pod
    resources: [claimed-governed]
    result: skip
  # the namespace scope: an unclaimed pod outside a governed Namespace is not this body's. It reads
  # Excluded while the selector holds, and "Want skip, got pass" if the selector is lost.
  - policy: governed-namespace-requires-claim
    kind: Pod
    resources: [unclaimed-ungoverned]
    result: skip
