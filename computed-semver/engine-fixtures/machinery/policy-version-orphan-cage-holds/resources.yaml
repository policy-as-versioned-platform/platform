# An orphan-claiming pod that tried to relabel itself off the bottom rung.
apiVersion: v1
kind: Pod
metadata:
  name: orphan-relabelled
  namespace: app-ns
  labels:
    policy-as-versioned.dev/policy-version: "0.0.1"
    posture.acme.io/caged: "true"
    posture.acme.io/tier: baseline
spec:
  containers: [{ name: c, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata: { name: served-claim, namespace: app-ns, labels: { "policy-as-versioned.dev/policy-version": "5.0.0" } }
spec:
  containers: [{ name: c, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata: { name: unclaimed, namespace: app-ns }
spec:
  containers: [{ name: c, image: nginx }]
