apiVersion: v1
kind: Pod
metadata: { name: orphan-claim, namespace: app-ns, labels: { "policy-as-versioned.dev/policy-version": "0.0.1" } }
spec:
  initContainers: [{ name: setup, image: busybox, securityContext: { privileged: true } }]
  containers: [{ name: c, image: nginx, securityContext: { privileged: true } }]
---
apiVersion: v1
kind: Pod
metadata: { name: served-claim, namespace: app-ns, labels: { "policy-as-versioned.dev/policy-version": "5.0.0" } }
spec:
  containers: [{ name: c, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata: { name: unclaimed, namespace: app-ns }
spec:
  containers: [{ name: c, image: nginx }]
