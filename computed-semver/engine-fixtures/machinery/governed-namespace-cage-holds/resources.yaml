# An unclaimed pod in a governed Namespace that tried to relabel itself off the bottom rung.
apiVersion: v1
kind: Pod
metadata:
  name: unclaimed-relabelled
  namespace: governed-ns
  labels:
    posture.acme.io/caged: "true"
    posture.acme.io/tier: baseline
spec:
  containers: [{ name: c, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata: { name: claimed-governed, namespace: governed-ns, labels: { "policy-as-versioned.dev/policy-version": "5.0.0" } }
spec:
  containers: [{ name: c, image: nginx }]
