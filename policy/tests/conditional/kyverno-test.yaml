# Conditional policy, offline (`kyverno test`). Proves "you may X *if* C" admits
# uniformly for anyone meeting C, fails those who don't, and self-scopes out the
# unversioned pod — no carve-outs, no named teams.
# cs-16: retargeted from the deleted policy/policies/v1.0.0/may-run-root-if-attested.yaml
# to distribution/policies/v2.0.1/require-nonroot.yaml -- the same conditional rule,
# folded in as a patch widening on the 2.0.0 line. Lineage follows content, not the
# old directory-name coincidence (the same convention ticket 15 already established
# for require-nonroot's own coexistence fixtures).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: may-run-root-if-attested
policies:
  - ../../../distribution/policies/v2.0.1/require-nonroot.yaml
resources:
  - resources.yaml
results:
  - policy: require-nonroot-2-0-1
    kind: Pod
    resources: [nonroot, root-attested-hardened]
    result: pass
  - policy: require-nonroot-2-0-1
    kind: Pod
    resources: [root-bare, root-attested-unhardened]
    result: fail
  - policy: require-nonroot-2-0-1
    kind: Pod
    resources: [unversioned]
    result: skip
