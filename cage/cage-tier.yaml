# Applies only to pods that carry this policy version's label: see the matchCondition only-this-policy-version.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: cage-tier-8-0-2
  labels:
    app.kubernetes.io/part-of: platform
    policy-as-versioned.dev/policy: graded-enforcement
    policy-as-versioned.dev/policy-version: 8.0.2
spec:
  # The cage acts on pods. Kyverno's rewrite of it for pod controllers is switched off: a controller's pods are caged when they are created.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: only-this-policy-version
    expression: object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') == '8.0.2'
  variables:
  - name: nsTier
    expression: "namespaceObject != null && namespaceObject.metadata.?labels['policy-as-versioned.dev/governed'].orValue('') == 'true'\n  ? namespaceObject.metadata.?labels['posture.acme.io/tier'].orValue('')\n  : ''"
  - name: tier
    expression: "variables.nsTier in ['baseline', 'quarantine', 'isolated']\n  ? variables.nsTier\n  : 'isolated'"
  - name: dial
    expression: "{'baseline':  {'cpu':'500m','mem':'256Mi','harden':'false'},\n 'quarantine':{'cpu':'100m','mem':'64Mi', 'harden':'true'},\n 'isolated':  {'cpu':'100m','mem':'64Mi', 'harden':'true'}}[variables.tier]"
  # On an update only the labels are set, because a running pod's limits and capabilities cannot change. They are set when a pod is created.
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "request.operation == \"CREATE\" ? Object{\n  metadata: Object.metadata{ labels: {\n    \"posture.acme.io/caged\": \"true\",\n    \"posture.acme.io/tier\": string(variables.tier)\n  } },\n  spec: Object.spec{\n    hostNetwork: false,\n    hostPID: false,\n    hostIPC: false,\n    containers: object.spec.containers.map(c, Object.spec.containers{\n      name: c.name,\n      resources: Object.spec.containers.resources{\n        limits: {\n          \"cpu\": (has(c.resources) && c.resources.?limits[\"cpu\"].hasValue() &&\n                  quantity(string(c.resources.limits[\"cpu\"])).isLessThan(quantity(variables.dial.cpu)))\n                   ? string(c.resources.limits[\"cpu\"]) : variables.dial.cpu,\n          \"memory\": (has(c.resources) && c.resources.?limits[\"memory\"].hasValue() &&\n                  quantity(string(c.resources.limits[\"memory\"])).isLessThan(quantity(variables.dial.mem)))\n                   ? string(c.resources.limits[\"memory\"]) : variables.dial.mem\n        }\n      },\n      securityContext: Object.spec.containers.securityContext{\n        readOnlyRootFilesystem: variables.dial.harden == 'true' ||\n          (has(c.securityContext) && c.securityContext.?readOnlyRootFilesystem.orValue(false)),\n        runAsNonRoot: variables.dial.harden == 'true' ||\n          c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)),\n        allowPrivilegeEscalation: false,\n        privileged: false\n      }\n    })\n  }\n}\n: Object{\n  metadata: Object.metadata{ labels: {\n    \"posture.acme.io/caged\": \"true\",\n    \"posture.acme.io/tier\": string(variables.tier)\n  } }\n}"
  - patchType: JSONPatch
    jsonPatch:
      expression: "request.operation == \"CREATE\" && variables.dial.harden == 'true'\n  ? object.spec.containers.map(c,\n      JSONPatch{\n        op: \"add\",\n        path: \"/spec/containers/\" + string(object.spec.containers.indexOf(c)) + \"/securityContext/capabilities\",\n        value: {\"drop\": [\"ALL\"]}\n      })\n  : []"
